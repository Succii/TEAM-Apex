<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Asi se dice - AI Translator</title>
</head>
<body>
    <div class="container">
        <h1 class="main-title">ASÍ SE DICE</h1>
        <p class="subtitle">Traductor Técnico-Criollo v1.0</p>
        
        <div id="terminal">
            <div id="display-area">
                <p class="system-msg">>>> Conexión establecida con el nodo Aguadilla...</p>
                <p class="system-msg">>>> Ingrese reporte técnico formal para traducir:</p>
            </div>
            
            <div class="input-container">
                <span class="prompt">Admin@Inter_Aguadilla></span>
                <input type="text" id="user-input" placeholder="Ej: Falla en el protocolo OSPF..." autofocus>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
