<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Asi se dice - AI Translator</title>
</head>
<body>
    <div class="container">
        <h1 class="main-title">ASÍ SE DICE</h1>
        <p class="subtitle">Traductor Técnico-Criollo v1.0</p>

        <div id="terminal">
            <div id="display-area">
                <p class="system-msg">>>> Entrando al verdadero calenton...</p>
            </div>

            <div class="input-container">
                <span class="prompt">User: </span>
                <input type="text" id="user-input" placeholder="Mano, hoy el tapón estaba brutal" autofocus>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
